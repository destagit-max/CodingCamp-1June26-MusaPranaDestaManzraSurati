<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="theme-toggle-container">
        <button id="themeToggleBtn">🌙 Mode Gelap</button>
    </div>

    <div class="dashboard-container">
        <header class="card greeting-card">
            <h1 id="clock">00:00:00</h1>
            <p id="date">Hari, Tanggal Bulan Tahun</p>
            <h2 id="greetingText">Good Morning, <span id="userName" contenteditable="true">[Ketik namamu disini..]</span></h2>
        </header>

        <div class="main-content">
            <section class="card timer-card">
                <h3>Focus Timer</h3>
                <div id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button id="startTimerBtn">Start</button>
                    <button id="stopTimerBtn">Stop</button>
                    <button id="resetTimerBtn">Reset</button>
                </div>
            </section>

            <section class="card todo-card">
                <h3>Tasks</h3>
                <form id="todoForm">
                    <input type="text" id="todoInput" placeholder="Add a new task..." required>
                    <button type="submit">Add</button>
                </form>
                <ul id="todoList">
                    </ul>
            </section>
        </div>

        <footer class="card links-card">
            <h3>Quick Links</h3>
            <form id="linkForm">
                <input type="text" id="linkNameInput" placeholder="Link name" required>
                <input type="url" id="linkUrlInput" placeholder="URL (https://...)" required>
                <button type="submit">Add Link</button>
            </form>
            <div id="linksContainer">
                </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
